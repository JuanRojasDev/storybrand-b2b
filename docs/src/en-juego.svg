<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Lo que está en juego</title>
  <desc id="d">Si nada cambia: tu web habla de ti, compites por precio y los correos quedan sin respuesta. Con tu guion de marca: te entienden en cinco segundos, compites por claridad y cada documento pide un siguiente paso.</desc>
  <style>
    {{FONTFACE}}
    .d { font-family: "Tomorrow SB", "Segoe UI", sans-serif; font-weight: 600; }
    .b { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rise { opacity: 0; animation: up 700ms cubic-bezier(0.23, 1, 0.32, 1) var(--t, 0s) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .slide { opacity: 0; animation: slide 800ms cubic-bezier(0.23, 1, 0.32, 1) var(--t, 0s) forwards; }
    @keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .slide { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="330" rx="24" fill="#0F4544"/>

  <g class="rise" style="--t:0.1s">
    <rect x="64" y="48" width="520" height="234" rx="18" fill="#0B3332" stroke="#F0897D" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="96" y="98" class="d" font-size="22" fill="#F0897D" letter-spacing="0.5">SI NADA CAMBIA</text>
  </g>
  <g class="b" font-size="18" fill="#F3EFE4">
    <g class="rise" style="--t:0.3s"><g transform="translate(108 146)"><circle r="12" fill="#F0897D"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#0B3332" stroke-width="2.4" stroke-linecap="round"/></g><text x="134" y="152">Tu web habla de ti y nadie escribe.</text></g>
    <g class="rise" style="--t:0.42s"><g transform="translate(108 194)"><circle r="12" fill="#F0897D"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#0B3332" stroke-width="2.4" stroke-linecap="round"/></g><text x="134" y="200">Tus propuestas compiten solo por precio.</text></g>
    <g class="rise" style="--t:0.54s"><g transform="translate(108 242)"><circle r="12" fill="#F0897D"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#0B3332" stroke-width="2.4" stroke-linecap="round"/></g><text x="134" y="248">Tus correos se quedan sin respuesta.</text></g>
  </g>

  <g class="slide" style="--t:0.9s">
    <rect x="616" y="48" width="520" height="234" rx="18" fill="#D4E56B"/>
    <text x="648" y="98" class="d" font-size="22" fill="#0F4544" letter-spacing="0.5">CON TU GUION DE MARCA</text>
  </g>
  <g class="b" font-size="18" fill="#0F4544">
    <g class="rise" style="--t:1.15s"><g transform="translate(660 146)"><circle r="12" fill="#0F4544"/><path d="M-5 0 L-1.5 3.5 L5 -3.5" fill="none" stroke="#D4E56B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="686" y="152">Te entienden en cinco segundos.</text></g>
    <g class="rise" style="--t:1.27s"><g transform="translate(660 194)"><circle r="12" fill="#0F4544"/><path d="M-5 0 L-1.5 3.5 L5 -3.5" fill="none" stroke="#D4E56B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="686" y="200">Compites por claridad, no solo por precio.</text></g>
    <g class="rise" style="--t:1.39s"><g transform="translate(660 242)"><circle r="12" fill="#0F4544"/><path d="M-5 0 L-1.5 3.5 L5 -3.5" fill="none" stroke="#D4E56B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="686" y="248">Cada documento pide un siguiente paso.</text></g>
  </g>
</svg>
