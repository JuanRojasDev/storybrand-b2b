<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="t d">
  <title id="t">Qué tanto ayuda la skill</title>
  <desc id="d">Criterios cumplidos en la primera corrida de la versión pública, 16 criterios en 3 documentos. Sin la skill: 62,5 por ciento, rango probable de 39 a 82 por ciento. Con la skill: 93,8 por ciento, rango probable de 72 a 99 por ciento. Los rangos se cruzan: la mejora es prometedora, pero todavía no es concluyente.</desc>
  <style>
    {{FONTFACE}}
    .d { font-family: "Tomorrow SB", "Segoe UI", sans-serif; font-weight: 600; }
    .b { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: center bottom; transform: scaleY(0); animation: grow 1100ms cubic-bezier(0.23, 1, 0.32, 1) var(--t) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    .late { opacity: 0; animation: fade 500ms ease var(--t) forwards; }
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: up 700ms cubic-bezier(0.23, 1, 0.32, 1) var(--t, 0s) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: none; }
      .late, .rise { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="570" rx="24" fill="#0F4544"/>

  <text x="64" y="72" class="d rise" font-size="30" fill="#F3EFE4" letter-spacing="-0.3">QUÉ TANTO AYUDA LA SKILL</text>
  <text x="64" y="102" class="b rise" style="--t:0.1s" font-size="16" fill="#A8C6C0">Criterios cumplidos · 3 documentos · 16 criterios verificables · primera corrida de la versión pública</text>

  <!-- scale: baseline y=470, 100 % = 300 px -->
  <g class="b" font-size="13" fill="#7FA59E" text-anchor="end">
    <line x1="230" y1="395" x2="720" y2="395" stroke="#2C6B68" stroke-dasharray="4 6"/><text x="218" y="399">25 %</text>
    <line x1="230" y1="320" x2="720" y2="320" stroke="#2C6B68" stroke-dasharray="4 6"/><text x="218" y="324">50 %</text>
    <line x1="230" y1="245" x2="720" y2="245" stroke="#2C6B68" stroke-dasharray="4 6"/><text x="218" y="249">75 %</text>
  </g>

  <!-- without the skill: 62.5 %, Wilson 95 % interval 38.6–81.5 -->
  <rect class="bar" style="--t:0.3s" x="300" y="282.5" width="140" height="187.5" rx="10" fill="#7FA59E"/>
  <g class="late" style="--t:1.2s" stroke="#F3EFE4" stroke-width="2.5" stroke-linecap="round">
    <line x1="370" y1="354.2" x2="370" y2="225.5"/><line x1="358" y1="354.2" x2="382" y2="354.2"/><line x1="358" y1="225.5" x2="382" y2="225.5"/>
  </g>
  <text x="370" y="206" class="d late" style="--t:1.2s" font-size="38" fill="#F3EFE4" text-anchor="middle">62,5 %</text>

  <!-- with the skill: 93.75 %, Wilson 95 % interval 71.7–98.9 -->
  <rect class="bar" style="--t:0.5s" x="520" y="188.75" width="140" height="281.25" rx="10" fill="#D4E56B"/>
  <g class="late" style="--t:1.4s" stroke="#F3EFE4" stroke-width="2.5" stroke-linecap="round">
    <line x1="590" y1="254.9" x2="590" y2="173.3"/><line x1="578" y1="254.9" x2="602" y2="254.9"/><line x1="578" y1="173.3" x2="602" y2="173.3"/>
  </g>
  <text x="590" y="154" class="d late" style="--t:1.4s" font-size="38" fill="#D4E56B" text-anchor="middle">93,8 %</text>

  <line x1="230" y1="470" x2="720" y2="470" stroke="#A8C6C0" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="370" y="500" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">SIN LA SKILL</text>
    <text x="370" y="522" class="b" font-size="14" fill="#A8C6C0">10 de 16 criterios · rango 39–82 %</text>
    <text x="590" y="500" class="d" font-size="17" fill="#D4E56B" letter-spacing="0.5">CON LA SKILL</text>
    <text x="590" y="522" class="b" font-size="14" fill="#A8C6C0">15 de 16 criterios · rango 72–99 %</text>
  </g>

  <g class="rise" style="--t:1.7s">
    <rect x="780" y="150" width="356" height="320" rx="18" fill="#165553"/>
    <text x="808" y="192" class="d" font-size="18" fill="#F3EFE4" letter-spacing="0.5">CÓMO LEERLO</text>
    <g stroke="#F3EFE4" stroke-width="2.5" stroke-linecap="round" transform="translate(816 222)">
      <line x1="0" y1="-14" x2="0" y2="14"/><line x1="-8" y1="-14" x2="8" y2="-14"/><line x1="-8" y1="14" x2="8" y2="14"/>
    </g>
    <g class="b" font-size="15" fill="#E6EFEC">
      <text x="836" y="218">La línea sobre cada barra es el</text>
      <text x="836" y="238">rango probable del resultado (95 %).</text>
      <text x="808" y="284">Con tan pocas pruebas, los rangos</text>
      <text x="808" y="304">se cruzan: la mejora es prometedora,</text>
      <text x="808" y="324">pero todavía no es concluyente.</text>
      <text x="808" y="370" fill="#F0897D">Dónde falló: un correo salió</text>
      <text x="808" y="390" fill="#F0897D">demasiado largo. Se ajustó la regla</text>
      <text x="808" y="410" fill="#F0897D">y en la siguiente corrida cumplió.</text>
    </g>
  </g>

  <text x="64" y="552" class="b rise" style="--t:1.9s" font-size="14" fill="#A8C6C0">Una corrida por caso, evaluada por el autor. Más pruebas harán los rangos más estrechos; ninguna herramienta acierta siempre.</text>
</svg>
