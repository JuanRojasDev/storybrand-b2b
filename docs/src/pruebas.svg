<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">Resultados de las pruebas</title>
  <desc id="d">Primera corrida de la versión pública, 16 criterios en 3 documentos. Con la skill: 93,8 por ciento. Sin la skill: 62,5 por ciento. Por categoría, con y sin la skill: plan en pasos 100 y 0; abre con el cliente 100 y 75; llamado a la acción 100 y 67; cero datos inventados 100 y 67; extensión adecuada 50 y 0; formato y datos obligatorios 100 y 100.</desc>
  <style>
    {{FONTFACE}}
    .d { font-family: "Tomorrow SB", "Segoe UI", sans-serif; font-weight: 600; }
    .b { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1000ms cubic-bezier(0.23, 1, 0.32, 1) var(--t) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .val { opacity: 0; animation: fade 400ms ease calc(var(--t) + 700ms) forwards; }
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: up 700ms cubic-bezier(0.23, 1, 0.32, 1) var(--t, 0s) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: none; }
      .val, .rise { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="620" rx="24" fill="#0F4544"/>

  <text x="64" y="72" class="d rise" font-size="30" fill="#F3EFE4" letter-spacing="-0.3">RESULTADOS DE LAS PRUEBAS</text>
  <text x="64" y="102" class="b rise" style="--t:0.1s" font-size="16" fill="#A8C6C0">Versión pública, primera corrida · 3 documentos · 16 criterios verificables</text>

  <g class="rise" style="--t:0.2s" text-anchor="end">
    <text x="930" y="84" class="d" font-size="52" fill="#F3EFE4" fill-opacity="0.72">62,5 %</text>
    <text x="930" y="110" class="b" font-size="14" fill="#A8C6C0">sin la skill</text>
    <text x="1136" y="84" class="d" font-size="52" fill="#D4E56B">93,8 %</text>
    <text x="1136" y="110" class="b" font-size="14" fill="#A8C6C0">con la skill</text>
  </g>

  <g class="b rise" style="--t:0.3s" font-size="14" fill="#A8C6C0">
    <rect x="420" y="146" width="14" height="14" rx="3" fill="#D4E56B"/><text x="442" y="158">Con la skill</text>
    <rect x="550" y="146" width="14" height="14" rx="3" fill="#7FA59E"/><text x="572" y="158">Sin la skill</text>
  </g>

  <!-- rows: label, criteria count, bars (640 px = 100 %) -->
  <g class="b">
    <text x="64" y="204" font-size="17" fill="#F3EFE4">Plan en pasos</text>
    <text x="64" y="224" font-size="13" fill="#A8C6C0">1 criterio</text>
    <rect class="bar" style="--t:0.5s" x="420" y="188" width="640" height="18" rx="4" fill="#D4E56B"/>
    <rect class="bar" style="--t:0.56s" x="420" y="212" width="0" height="18" rx="4" fill="#7FA59E"/>
    <text class="d val" style="--t:0.5s" x="1070" y="202" font-size="14" fill="#D4E56B">100 %</text>
    <text class="d val" style="--t:0.56s" x="430" y="226" font-size="14" fill="#A8C6C0">0 %</text>

    <text x="64" y="268" font-size="17" fill="#F3EFE4">Abre con el cliente</text>
    <text x="64" y="288" font-size="13" fill="#A8C6C0">4 criterios</text>
    <rect class="bar" style="--t:0.62s" x="420" y="252" width="640" height="18" rx="4" fill="#D4E56B"/>
    <rect class="bar" style="--t:0.68s" x="420" y="276" width="480" height="18" rx="4" fill="#7FA59E"/>
    <text class="d val" style="--t:0.62s" x="1070" y="266" font-size="14" fill="#D4E56B">100 %</text>
    <text class="d val" style="--t:0.68s" x="910" y="290" font-size="14" fill="#A8C6C0">75 %</text>

    <text x="64" y="332" font-size="17" fill="#F3EFE4">Llamado a la acción concreto</text>
    <text x="64" y="352" font-size="13" fill="#A8C6C0">3 criterios</text>
    <rect class="bar" style="--t:0.74s" x="420" y="316" width="640" height="18" rx="4" fill="#D4E56B"/>
    <rect class="bar" style="--t:0.8s" x="420" y="340" width="427" height="18" rx="4" fill="#7FA59E"/>
    <text class="d val" style="--t:0.74s" x="1070" y="330" font-size="14" fill="#D4E56B">100 %</text>
    <text class="d val" style="--t:0.8s" x="857" y="354" font-size="14" fill="#A8C6C0">67 %</text>

    <text x="64" y="396" font-size="17" fill="#F3EFE4">Cero datos inventados</text>
    <text x="64" y="416" font-size="13" fill="#A8C6C0">3 criterios</text>
    <rect class="bar" style="--t:0.86s" x="420" y="380" width="640" height="18" rx="4" fill="#D4E56B"/>
    <rect class="bar" style="--t:0.92s" x="420" y="404" width="427" height="18" rx="4" fill="#7FA59E"/>
    <text class="d val" style="--t:0.86s" x="1070" y="394" font-size="14" fill="#D4E56B">100 %</text>
    <text class="d val" style="--t:0.92s" x="857" y="418" font-size="14" fill="#A8C6C0">67 %</text>

    <text x="64" y="460" font-size="17" fill="#F3EFE4">Extensión adecuada</text>
    <text x="64" y="480" font-size="13" fill="#A8C6C0">2 criterios</text>
    <rect class="bar" style="--t:0.98s" x="420" y="444" width="320" height="18" rx="4" fill="#D4E56B"/>
    <rect class="bar" style="--t:1.04s" x="420" y="468" width="0" height="18" rx="4" fill="#7FA59E"/>
    <text class="d val" style="--t:0.98s" x="750" y="458" font-size="14" fill="#D4E56B">50 %</text>
    <text class="d val" style="--t:1.04s" x="430" y="482" font-size="14" fill="#A8C6C0">0 %</text>

    <text x="64" y="524" font-size="17" fill="#F3EFE4">Formato y datos obligatorios</text>
    <text x="64" y="544" font-size="13" fill="#A8C6C0">3 criterios</text>
    <rect class="bar" style="--t:1.1s" x="420" y="508" width="640" height="18" rx="4" fill="#D4E56B"/>
    <rect class="bar" style="--t:1.16s" x="420" y="532" width="640" height="18" rx="4" fill="#7FA59E"/>
    <text class="d val" style="--t:1.1s" x="1070" y="522" font-size="14" fill="#D4E56B">100 %</text>
    <text class="d val" style="--t:1.16s" x="1070" y="546" font-size="14" fill="#A8C6C0">100 %</text>
  </g>

  <text x="64" y="590" class="b rise" style="--t:1.4s" font-size="14" fill="#A8C6C0">Una corrida por caso, evaluada por el autor. Después se ajustó la extensión de los correos. Pocas pruebas: es una señal, no una garantía.</text>
</svg>
