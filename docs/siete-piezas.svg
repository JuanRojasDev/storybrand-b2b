<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-labelledby="t d">
  <title id="t">Las siete piezas de una historia que vende</title>
  <desc id="d">Una curva narrativa con siete puntos que se encienden en orden: personaje, problema, guía, plan, acción, lo que está en juego y éxito.</desc>
  <style>
    @font-face { font-family: "Tomorrow SB"; font-weight: 600; src: url(data:font/woff;base64,) format("woff"); }
    .d { font-family: "Tomorrow SB", "Segoe UI", sans-serif; font-weight: 600; }
    .b { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .arc { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 2.6s cubic-bezier(0.23, 1, 0.32, 1) 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 600ms cubic-bezier(0.23, 1, 0.32, 1) var(--t) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
    .lab { opacity: 0; animation: up 600ms cubic-bezier(0.23, 1, 0.32, 1) var(--t) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: up 700ms cubic-bezier(0.23, 1, 0.32, 1) var(--t, 0s) forwards; }
    @media (prefers-reduced-motion: reduce) {
      .arc { animation: none; stroke-dashoffset: 0; }
      .node, .lab, .rise { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="510" rx="24" fill="#0F4544"/>

  <text x="64" y="72" class="d rise" font-size="30" fill="#F3EFE4" letter-spacing="-0.3">LAS SIETE PIEZAS DE UNA HISTORIA QUE VENDE</text>
  <text x="64" y="108" class="b rise" style="--t:0.12s" font-size="17" fill="#A8C6C0">Tu cliente recorre el camino. Tu marca aparece como guía, nunca como protagonista.</text>

  <g class="b rise" style="--t:0.2s" font-size="14" fill="#A8C6C0">
    <circle cx="890" cy="153" r="7" fill="none" stroke="#F3EFE4" stroke-width="2.5"/><text x="904" y="158">lo vive tu cliente</text>
    <circle cx="1030" cy="153" r="7" fill="#D4E56B"/><text x="1044" y="158">lo aporta tu marca</text>
  </g>

  <path class="arc" pathLength="100" d="M 120 340 C 145.8 348.3, 223.3 390.8, 275 390 C 326.7 389.2, 378.3 349.2, 430 335 C 481.7 320.8, 533.3 315.0, 585 305 C 636.7 295.0, 688.3 272.5, 740 275 C 791.7 277.5, 840.0 327.5, 895 320 C 950.0 312.5, 1040.8 245.0, 1070 230" fill="none" stroke="#2C6B68" stroke-width="6" stroke-linecap="round"/>

  
  <g class="node" style="--t:0.50s">
    <circle cx="120" cy="340" r="24" fill="#0F4544" stroke="#F3EFE4" stroke-width="3"/>
    <text x="120" y="347" class="d" font-size="19" fill="#F3EFE4" text-anchor="middle">1</text>
  </g>
  <g class="lab" style="--t:0.50s" text-anchor="middle">
    <text x="120" y="394" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">PERSONAJE</text>
    <text x="120" y="416" class="b" font-size="14" fill="#A8C6C0">¿Qué quiere</text>
    <text x="120" y="435" class="b" font-size="14" fill="#A8C6C0">tu cliente?</text>
  </g>
  <g class="node" style="--t:0.78s">
    <circle cx="275" cy="390" r="24" fill="#0F4544" stroke="#F3EFE4" stroke-width="3"/>
    <text x="275" y="397" class="d" font-size="19" fill="#F3EFE4" text-anchor="middle">2</text>
  </g>
  <g class="lab" style="--t:0.78s" text-anchor="middle">
    <text x="275" y="444" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">PROBLEMA</text>
    <text x="275" y="466" class="b" font-size="14" fill="#A8C6C0">¿Qué lo frena y</text>
    <text x="275" y="485" class="b" font-size="14" fill="#A8C6C0">cómo se siente?</text>
  </g>
  <g class="node" style="--t:1.06s">
    <circle cx="430" cy="335" r="24" fill="#D4E56B" stroke="none" stroke-width="3"/>
    <text x="430" y="342" class="d" font-size="19" fill="#0F4544" text-anchor="middle">3</text>
  </g>
  <g class="lab" style="--t:1.06s" text-anchor="middle">
    <text x="430" y="389" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">GUÍA</text>
    <text x="430" y="411" class="b" font-size="14" fill="#A8C6C0">Empatía +</text>
    <text x="430" y="430" class="b" font-size="14" fill="#A8C6C0">autoridad</text>
  </g>
  <g class="node" style="--t:1.34s">
    <circle cx="585" cy="305" r="24" fill="#D4E56B" stroke="none" stroke-width="3"/>
    <text x="585" y="312" class="d" font-size="19" fill="#0F4544" text-anchor="middle">4</text>
  </g>
  <g class="lab" style="--t:1.34s" text-anchor="middle">
    <text x="585" y="359" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">PLAN</text>
    <text x="585" y="381" class="b" font-size="14" fill="#A8C6C0">Tres pasos</text>
    <text x="585" y="400" class="b" font-size="14" fill="#A8C6C0">claros</text>
  </g>
  <g class="node" style="--t:1.62s">
    <circle cx="740" cy="275" r="24" fill="#D4E56B" stroke="none" stroke-width="3"/>
    <text x="740" y="282" class="d" font-size="19" fill="#0F4544" text-anchor="middle">5</text>
  </g>
  <g class="lab" style="--t:1.62s" text-anchor="middle">
    <text x="740" y="329" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">ACCIÓN</text>
    <text x="740" y="351" class="b" font-size="14" fill="#A8C6C0">Un llamado</text>
    <text x="740" y="370" class="b" font-size="14" fill="#A8C6C0">concreto</text>
  </g>
  <g class="node" style="--t:1.90s">
    <circle cx="895" cy="320" r="24" fill="#0F4544" stroke="#F0897D" stroke-width="3"/>
    <text x="895" y="327" class="d" font-size="19" fill="#F0897D" text-anchor="middle">6</text>
  </g>
  <g class="lab" style="--t:1.90s" text-anchor="middle">
    <text x="895" y="374" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">EN JUEGO</text>
    <text x="895" y="396" class="b" font-size="14" fill="#A8C6C0">Qué pierde</text>
    <text x="895" y="415" class="b" font-size="14" fill="#A8C6C0">si no actúa</text>
  </g>
  <g class="node" style="--t:2.18s">
    <circle cx="1070" cy="230" r="24" fill="#7DC79E" stroke="none" stroke-width="3"/>
    <text x="1070" y="237" class="d" font-size="19" fill="#0F4544" text-anchor="middle">7</text>
  </g>
  <g class="lab" style="--t:2.18s" text-anchor="middle">
    <text x="1070" y="284" class="d" font-size="17" fill="#F3EFE4" letter-spacing="0.5">ÉXITO</text>
    <text x="1070" y="306" class="b" font-size="14" fill="#A8C6C0">Cómo se ve</text>
    <text x="1070" y="325" class="b" font-size="14" fill="#A8C6C0">el final feliz</text>
  </g>
</svg>
