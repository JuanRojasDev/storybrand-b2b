<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Antes y después</title>
  <desc id="d">Animación que alterna un texto donde la empresa es el héroe con uno donde el cliente es el héroe y la empresa es el guía.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
    .k { font-size: 22px; font-weight: 700; fill: #1F2328; }
    .p { font-size: 20px; fill: #2F3A44; }
    .n { font-size: 15px; font-weight: 600; }
    @keyframes a { 0%, 44% { opacity: 1; } 50%, 94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes b { 0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes bar { 0% { width: 0; } 50% { width: 1072px; } 50.01% { width: 0; } 100% { width: 1072px; } }
    .antes { animation: a 12s ease-in-out infinite; }
    .despues { opacity: 0; animation: b 12s ease-in-out infinite; }
    .progress { animation: bar 12s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .antes { animation: none; opacity: 0; }
      .despues { animation: none; opacity: 1; }
      .progress { animation: none; width: 1072px; }
    }
  </style>
  <rect x="1" y="1" width="1198" height="378" rx="20" fill="#FBFAF7" stroke="#E6E2D8" stroke-width="2"/>

  <g class="antes">
    <rect x="64" y="40" width="96" height="28" rx="14" fill="#F6E1DC"/>
    <text x="112" y="59" class="h" fill="#B4442F" text-anchor="middle">ANTES</text>
    <text x="176" y="61" class="k">La empresa es el héroe</text>
    <text x="64" y="128" class="p">Somos una firma con más de diez años de experiencia en ingeniería, interventoría</text>
    <text x="64" y="160" class="p">y sostenibilidad, con un equipo altamente calificado y comprometido con la</text>
    <text x="64" y="192" class="p">excelencia. Ofrecemos soluciones integrales para todo tipo de proyectos.</text>
    <text x="64" y="268" class="n" fill="#B4442F">✗ Habla de la empresa     ✗ Adjetivos sin prueba     ✗ Sin plan     ✗ Sin siguiente paso</text>
  </g>

  <g class="despues">
    <rect x="64" y="40" width="118" height="28" rx="14" fill="#DDEFE5"/>
    <text x="123" y="59" class="h" fill="#2E7D32" text-anchor="middle">DESPUÉS</text>
    <text x="198" y="61" class="k">El cliente es el héroe, la empresa es el guía</text>
    <text x="64" y="128" class="p">Su equipo necesita certificar el edificio sin frenar la operación ni perseguir</text>
    <text x="64" y="160" class="p">documentos entre áreas. Lo acompañamos en tres pasos: diagnóstico, plan de</text>
    <text x="64" y="192" class="p">puntos con responsables y revisión final. [Caso similar: cliente, año, resultado.]</text>
    <text x="64" y="224" class="p">¿Agendamos 30 minutos esta semana?</text>
    <text x="64" y="268" class="n" fill="#2E7D32">✓ Abre con el cliente     ✓ Plan en pasos     ✓ Evidencia verificable     ✓ Llamado a la acción</text>
  </g>

  <rect x="64" y="318" width="1072" height="6" rx="3" fill="#E6E2D8"/>
  <rect class="progress" x="64" y="318" width="1072" height="6" rx="3" fill="#0E7C66"/>
</svg>
